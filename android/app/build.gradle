plugins { id 'com.android.application' }
android {
    namespace 'com.ownvpn.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'com.ownvpn.android'
        minSdk 26
        targetSdk 36
        versionCode 500
        versionName '0.5.0-alpha.1'
        testInstrumentationRunner 'com.ownvpn.android.SmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++20' } }
    }
    externalNativeBuild { cmake { path file('../../src/platform/android/CMakeLists.txt'); version '3.31.6'; buildStagingDirectory file('../../build/android-native') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    sourceSets { main { assets.srcDirs += '../../build/android-licenses' }; androidTest { assets.srcDirs += '../../tests/fixtures' } }
}
tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets') task.dependsOn('externalNativeBuildDebug')
    if (task.name == 'mergeReleaseAssets') task.dependsOn('externalNativeBuildRelease')
}
